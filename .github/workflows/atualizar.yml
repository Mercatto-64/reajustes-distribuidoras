# Monta a página e publica no GitHub Pages.
# Roda sozinha quando a ponte (ponte/ponte.ps1, num computador no Brasil) envia os dados da semana,
# e quando alguém clicar em "Run workflow" na aba Actions.
# Toda terça confere se a ponte enviou dados novos; se não enviou, a execução falha
# e o GitHub manda um e-mail avisando. A página antiga continua no ar.
name: Atualizar página

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 2'   # terça, 12h em Brasília: só a conferência

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  conferir:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir se a ponte enviou dados novos
        shell: pwsh
        run: |
          $coleta = [datetime]::ParseExact((Get-Content dados/coleta.txt -Raw).Trim(), 'yyyy-MM-dd HH:mm', $null)
          $dias = ((Get-Date).ToUniversalTime().AddHours(-3) - $coleta).TotalDays
          if ($dias -gt 8) { throw "A ponte não envia dados desde $($coleta.ToString('dd/MM/yyyy')). Verifique o computador da ponte (ponte.log)." }
          Write-Host "OK: dados de $($coleta.ToString('dd/MM/yyyy HH:mm'))."

  gerar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a página
        shell: pwsh
        run: ./gerar.ps1 -Saida _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
